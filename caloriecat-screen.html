<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalorieCat - Главная</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Raleway', sans-serif;
      background: #f0eefc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .phone {
      width: 375px;
      height: 812px;
      background: #faf8ff;
      border-radius: 44px;
      box-shadow: 0 32px 80px rgba(139,92,246,0.18), 0 8px 24px rgba(0,0,0,0.1);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: white;
      padding: 16px 20px 0;
      box-shadow: 0 2px 12px rgba(139,92,246,0.06);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .greeting {
      font-size: 13px;
      color: #8B5CF6;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .header-date {
      font-size: 17px;
      font-weight: 700;
      color: #1e1b4b;
    }

    .streak-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #8B5CF6, #a78bfa);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* Week calendar */
    .week-calendar {
      display: flex;
      gap: 4px;
      padding-bottom: 14px;
    }

    .day-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .day-label {
      font-size: 10px;
      font-weight: 600;
      color: #a5a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .day-num {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #6b7280;
      transition: all 0.2s;
    }

    .day-item.active .day-label { color: #8B5CF6; }
    .day-item.active .day-num {
      background: linear-gradient(135deg, #8B5CF6, #a78bfa);
      color: white;
      box-shadow: 0 4px 12px rgba(139,92,246,0.4);
    }

    .day-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #d1d5db;
    }

    .day-item.active .day-dot { background: #8B5CF6; }
    .day-item.has-data .day-dot { background: #10B981; }

    /* Main scroll area */
    .main-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 100px;
      scrollbar-width: none;
    }
    .main-scroll::-webkit-scrollbar { display: none; }

    /* Cat + ring section */
    .ring-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0 16px;
      position: relative;
    }

    .cat-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin-bottom: -20px;
      z-index: 2;
    }

    .cat-emoji {
      font-size: 72px;
      line-height: 1;
      display: block;
      text-align: center;
      filter: drop-shadow(0 4px 8px rgba(139,92,246,0.2));
    }

    /* Circular progress */
    .ring-container {
      position: relative;
      width: 200px;
      height: 200px;
    }

    .ring-container svg {
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: #ede9fe;
      stroke-width: 14;
    }

    .ring-progress {
      fill: none;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: 534;
      stroke-dashoffset: 503; /* ~94% empty = 155/1708 */
      transition: stroke-dashoffset 1s ease;
    }

    .ring-gradient-purple { stroke: url(#purpleGrad); }

    .ring-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .kcal-consumed {
      font-size: 42px;
      font-weight: 800;
      color: #1e1b4b;
      line-height: 1;
    }

    .kcal-label {
      font-size: 11px;
      color: #8B5CF6;
      font-weight: 600;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kcal-remaining {
      font-size: 13px;
      color: #6b7280;
      font-weight: 500;
      margin-top: 4px;
    }

    .kcal-remaining span {
      color: #10B981;
      font-weight: 700;
    }

    /* Macros */
    .macros-card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-top: 16px;
      box-shadow: 0 4px 20px rgba(139,92,246,0.08);
    }

    .macros-title {
      font-size: 12px;
      font-weight: 700;
      color: #a5a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
    }

    .macros-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .macro-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .macro-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .macro-name {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .macro-carb .macro-name { color: #F59E0B; }
    .macro-protein .macro-name { color: #3B82F6; }
    .macro-fat .macro-name { color: #EF4444; }

    .macro-value {
      font-size: 16px;
      font-weight: 800;
      color: #1e1b4b;
    }

    .macro-max {
      font-size: 10px;
      color: #a5a3b8;
      font-weight: 500;
    }

    .macro-bar-bg {
      height: 6px;
      border-radius: 3px;
      background: #f3f4f6;
      overflow: hidden;
    }

    .macro-bar {
      height: 100%;
      border-radius: 3px;
      transition: width 1s ease;
    }

    .macro-carb .macro-bar { background: linear-gradient(90deg, #F59E0B, #FCD34D); width: 0.6%; }
    .macro-protein .macro-bar { background: linear-gradient(90deg, #3B82F6, #93C5FD); width: 9.8%; }
    .macro-fat .macro-bar { background: linear-gradient(90deg, #EF4444, #FCA5A5); width: 22.5%; }

    /* Action row */
    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .action-btn {
      flex: 1;
      background: white;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(139,92,246,0.08);
      transition: all 0.2s;
      border: none;
    }

    .action-btn:active { transform: scale(0.97); }

    .action-btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn-icon.green { background: #d1fae5; }
    .action-btn-icon.blue { background: #dbeafe; }

    .action-btn-text { flex: 1; }
    .action-btn-label { font-size: 11px; color: #a5a3b8; font-weight: 500; }
    .action-btn-value { font-size: 14px; font-weight: 700; color: #1e1b4b; }

    /* Meal log preview */
    .meal-card {
      background: white;
      border-radius: 20px;
      padding: 16px 18px;
      margin-top: 14px;
      box-shadow: 0 4px 20px rgba(139,92,246,0.08);
      cursor: pointer;
    }

    .meal-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .meal-card-title {
      font-size: 13px;
      font-weight: 700;
      color: #1e1b4b;
    }

    .meal-card-action {
      font-size: 12px;
      color: #8B5CF6;
      font-weight: 600;
    }

    .meal-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid #f9f8ff;
    }

    .meal-icon {
      font-size: 24px;
    }

    .meal-info { flex: 1; }
    .meal-name { font-size: 13px; font-weight: 600; color: #1e1b4b; }
    .meal-detail { font-size: 11px; color: #a5a3b8; font-weight: 500; }
    .meal-kcal { font-size: 13px; font-weight: 700; color: #8B5CF6; }

    /* FAB */
    .fab {
      position: absolute;
      right: 20px;
      bottom: 76px;
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #8B5CF6, #a78bfa);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(139,92,246,0.45);
      cursor: pointer;
      transition: all 0.2s;
      z-index: 10;
    }

    .fab:active { transform: scale(0.93); }

    .fab svg { width: 24px; height: 24px; stroke: white; stroke-width: 2.5; fill: none; }

    /* Bottom nav */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: white;
      border-top: 1px solid #f3f0ff;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
      box-shadow: 0 -4px 20px rgba(139,92,246,0.06);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      cursor: pointer;
      padding: 8px 4px;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .nav-icon svg {
      width: 22px;
      height: 22px;
      stroke: #d1d5db;
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.2s;
    }

    .nav-item.active .nav-icon svg { stroke: #8B5CF6; }
    .nav-item.active .nav-icon-bg { background: #ede9fe; border-radius: 10px; padding: 2px; }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      color: #d1d5db;
    }

    .nav-item.active .nav-label { color: #8B5CF6; }
  </style>
</head>
<body>
  <div class="phone">

    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div>
          <div class="greeting">Понедельник</div>
          <div class="header-date">13 апреля</div>
        </div>
        <div class="streak-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="1">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
          7 дней
        </div>
      </div>

      <!-- Week -->
      <div class="week-calendar">
        <div class="day-item active">
          <span class="day-label">Пн</span>
          <div class="day-num">13</div>
          <div class="day-dot"></div>
        </div>
        <div class="day-item has-data">
          <span class="day-label">Вт</span>
          <div class="day-num">14</div>
          <div class="day-dot"></div>
        </div>
        <div class="day-item">
          <span class="day-label">Ср</span>
          <div class="day-num">15</div>
          <div class="day-dot"></div>
        </div>
        <div class="day-item">
          <span class="day-label">Чт</span>
          <div class="day-num">16</div>
          <div class="day-dot"></div>
        </div>
        <div class="day-item">
          <span class="day-label">Пт</span>
          <div class="day-num">17</div>
          <div class="day-dot"></div>
        </div>
        <div class="day-item">
          <span class="day-label">Сб</span>
          <div class="day-num">18</div>
          <div class="day-dot"></div>
        </div>
        <div class="day-item">
          <span class="day-label">Вс</span>
          <div class="day-num">19</div>
          <div class="day-dot"></div>
        </div>
      </div>
    </div>

    <!-- Scroll area -->
    <div class="main-scroll">

      <!-- Ring + Cat -->
      <div class="ring-section">
        <div class="cat-wrapper">
          <span class="cat-emoji">🐱</span>
        </div>

        <div class="ring-container">
          <svg width="200" height="200" viewBox="0 0 200 200">
            <defs>
              <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#8B5CF6"/>
                <stop offset="100%" stop-color="#10B981"/>
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="100" cy="100" r="85"/>
            <circle class="ring-progress ring-gradient-purple" cx="100" cy="100" r="85"/>
          </svg>

          <div class="ring-inner">
            <div class="kcal-consumed">155</div>
            <div class="kcal-label">из 1708 ккал</div>
            <div class="kcal-remaining">осталось <span>1553</span></div>
          </div>
        </div>
      </div>

      <!-- Macros card -->
      <div class="macros-card">
        <div class="macros-title">Макронутриенты</div>
        <div class="macros-grid">
          <div class="macro-item macro-carb">
            <div class="macro-header">
              <span class="macro-name">Углев.</span>
            </div>
            <div class="macro-value">1.1 <span style="font-size:11px;color:#a5a3b8;font-weight:500">г</span></div>
            <div class="macro-bar-bg"><div class="macro-bar"></div></div>
            <div class="macro-max">из 192 г</div>
          </div>
          <div class="macro-item macro-protein">
            <div class="macro-header">
              <span class="macro-name">Белок</span>
            </div>
            <div class="macro-value">12.6 <span style="font-size:11px;color:#a5a3b8;font-weight:500">г</span></div>
            <div class="macro-bar-bg"><div class="macro-bar"></div></div>
            <div class="macro-max">из 128 г</div>
          </div>
          <div class="macro-item macro-fat">
            <div class="macro-header">
              <span class="macro-name">Жиры</span>
            </div>
            <div class="macro-value">10.6 <span style="font-size:11px;color:#a5a3b8;font-weight:500">г</span></div>
            <div class="macro-bar-bg"><div class="macro-bar"></div></div>
            <div class="macro-max">из 47 г</div>
          </div>
        </div>
      </div>

      <!-- Action row -->
      <div class="action-row">
        <button class="action-btn">
          <div class="action-btn-icon green">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </div>
          <div class="action-btn-text">
            <div class="action-btn-label">Добавлено</div>
            <div class="action-btn-value">1 продукт</div>
          </div>
        </button>
        <button class="action-btn">
          <div class="action-btn-icon blue">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <path d="M16 2v4M8 2v4M3 10h18"/>
            </svg>
          </div>
          <div class="action-btn-text">
            <div class="action-btn-label">Приёмов пищи</div>
            <div class="action-btn-value">1 приём</div>
          </div>
        </button>
      </div>

      <!-- Meal log -->
      <div class="meal-card">
        <div class="meal-card-header">
          <span class="meal-card-title">Сегодняшние приёмы</span>
          <span class="meal-card-action">Все →</span>
        </div>
        <div class="meal-item">
          <span class="meal-icon">🍳</span>
          <div class="meal-info">
            <div class="meal-name">Завтрак</div>
            <div class="meal-detail">08:30 · 1 продукт</div>
          </div>
          <div class="meal-kcal">155 ккал</div>
        </div>
      </div>

    </div>

    <!-- FAB -->
    <div class="fab">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
    </div>

    <!-- Bottom nav -->
    <div class="bottom-nav">
      <div class="nav-item active">
        <div class="nav-icon nav-icon-bg">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 22V12h6v10" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="nav-label">Главная</span>
      </div>
      <div class="nav-item">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h8" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="3" width="18" height="18" rx="2" stroke-linecap="round"/></svg>
        </div>
        <span class="nav-label">Дневник</span>
      </div>
      <div class="nav-item">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="nav-label">Вес</span>
      </div>
      <div class="nav-item">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="nav-label">Здоровье</span>
      </div>
    </div>

  </div>
</body>
</html>
